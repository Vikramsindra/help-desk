services:
  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    networks:
      - help-desk

  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    networks:
      - help-desk

networks:
  help-desk:
    driver: bridge
